<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b8fbd" />
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/src/assets/favicon-48x48.png" />
    <link rel="shortcut icon" href="/src/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/src/assets/site.webmanifest" />
    <title>Yesterlog</title>
    <script>
      // Resolve the theme class before first paint (stored choice, else system).
      // useThemeMode keeps it in sync afterwards; styles key off .theme-light /
      // .theme-dark only, so no @media duplication is needed in the CSS.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("yesterlog-theme");
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.classList.add(theme === "light" ? "theme-light" : "theme-dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
